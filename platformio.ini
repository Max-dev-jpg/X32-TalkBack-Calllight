; =============================================================================
; TalkBack CallLight - PlatformIO Configuration
; ESP32 OSC-based call light controller for Behringer X32 / Midas M32
; =============================================================================

[platformio]
name         = TalkBack-CallLight
description  = ESP32 call light controller for X32/M32 mixers
default_envs = esp32dev

; ─────────────────────────────────────────────────────────────────────────────
; Shared settings inherited by all environments
; ─────────────────────────────────────────────────────────────────────────────
[env]
platform        = espressif32
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 460800
monitor_dtr = 0
monitor_rts = 0

; LittleFS is used for web UI files in the data/ directory
board_build.filesystem = littlefs

; Library dependencies (cross-platform, pulled from GitHub)
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson      @ ^6.21.5
    adafruit/Adafruit NeoPixel @ ^1.12.0

; ─────────────────────────────────────────────────────────────────────────────
; Production environment
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0

; ─────────────────────────────────────────────────────────────────────────────
; Debug environment  –  verbose serial + extra checks
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev_debug]
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_MODE=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
monitor_filters = esp32_exception_decoder, colorize, time

; ─────────────────────────────────────────────────────────────────────────────
; OTA-enabled environment  –  same as production but OTA enabled
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev_ota]
extends    = env:esp32dev
upload_protocol = espota
upload_port     = talkback-calllight.local
upload_flags    =
    --port=3232
    --auth=otasecret
